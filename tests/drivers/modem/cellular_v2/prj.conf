CONFIG_ZTEST=y

CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_GPIO=y

CONFIG_MODEM=y
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_V2=y
CONFIG_MODEM_CELLULAR_HW_DEPENDENCIES=n
CONFIG_MODEM_CHAT=y
CONFIG_MODEM_PIPELINK=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
# The PPP L2 reports the link dead, as with the hardware dependencies
CONFIG_NET_L2_PPP_MGMT=y
# The PPP device reports why the modem failed
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_ETH_NATIVE_TAP=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MODEM_LOG_LEVEL_INF=y

CONFIG_MODEM_CELLULAR_APN=""
CONFIG_MODEM_CELLULAR_RECOVERY_BACKOFF_MS=100
CONFIG_MODEM_CELLULAR_MAX_RECOVERIES=3
CONFIG_MODEM_CELLULAR_PERIODIC_SCRIPT_MS=500
CONFIG_MODEM_CELLULAR_SIM_TIMEOUT_MS=1000

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
