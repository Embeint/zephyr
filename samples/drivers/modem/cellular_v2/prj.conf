CONFIG_MODEM=y
# The driver does not support UART polling
CONFIG_UART_ASYNC_API=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_V2=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# The PPP network interface the driver defines, brought up in the second phase
CONFIG_NETWORKING=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_IPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y
# Use the DNS servers PPP negotiates
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y

# Default APN from the SIM card subscriber identity
CONFIG_MODEM_CELLULAR_APN=""

CONFIG_LOG_BUFFER_SIZE=8192

CONFIG_LOG=y
CONFIG_MODEM_LOG_LEVEL_DBG=y
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=y
CONFIG_MODEM_CMUX_LOG_LEVEL_DBG=y
CONFIG_MODEM_CMUX_LOG_FRAMES=y

# Check whether the modem answers closing the PPP channel without a call on it
CONFIG_SAMPLE_PPP_CHANNEL_CLOSE_TEST=y
