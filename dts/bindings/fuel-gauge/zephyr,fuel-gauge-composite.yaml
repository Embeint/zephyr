description: |
  Composite fuel-gauge constructed from sensor devices

compatible: "zephyr,fuel-gauge-composite"

include: [fuel-gauge.yaml, battery.yaml]

properties:
  source-primary:
    type: phandle
    required: true
    description: |
      Primary device to read sensor data from.
      Device must implement the sensor API.

  source-secondary:
    type: phandle
    description: |
      Secondary device to read sensor data from.
      This device will be used if input-primary does not expose
      a channel.

      Device must implement the sensor API.

  source-secondary-fallback:
    type: boolean
    description: |
      Instead of the secondary device being used for channels the primary
      source does not expose, use it as a fallback measurement for the case
      the primary device fails.

  fuel-gauge-channels:
    type: boolean
    description: |
      Sources should be queried by the sensor API fuel gauge
      channels (SENSOR_CHAN_GAUGE_*), instead of the generic
      channels (SENSOR_CHAN_VOLTAGE, etc).

  charger-status:
    type: phandle
    description: |
      Charger device that exposes the `charger_status` property for charge
      state detection.

  charging-soc-estimator:
    type: boolean
    description: |
      Maintain a stateful state-of-charge estimate. Above
      charging-current-threshold-microamp, positive charging current is
      integrated using charge-full-design-microamp-hours. After charging, or after the
      charger stops reporting full, the estimate is gradually blended toward
      corrected OCV over the relaxation period.
      Corrected OCV is used otherwise.

      Requires charge-full-design-microamp-hours to be set.

      The estimate is only updated when the state of charge is read, so the
      application is expected to poll it regularly while charging. Charge is
      integrated using the current measured at each reading, so frequent
      polling tracks changes in charging current more closely. Gaps of more
      than 5 minutes between charging readings are not integrated. Instead,
      the reading after the gap uses corrected OCV and integration restarts
      from that reading.

  charging-current-threshold-microamp:
    type: int
    default: 10000
    description: |
      Positive charging current must exceed this value for the
      charging-soc-estimator to use coulomb counting instead of corrected OCV.

  ocv-relaxation-time-ms:
    type: int
    default: 60000
    description: |
      After significant charging ends, or the charger stops reporting full,
      time over which the estimator is recalibrated from its post-charge value
      to corrected OCV. The transition is measured from the last significant
      charging or full reading, and all
      subsequent readings, including discharge readings, advance it. A value
      of 0 switches to corrected OCV on the first reading after charging.
