description: Telit LE910C1tx Modem

compatible: "telit,le910c1tx"

include: zephyr,cellular-modem-device.yaml

properties:
  mdm-power-gpios:
    type: phandle-array
    required: true

  mdm-reset-gpios:
    type: phandle-array
    required: true

  sim-detect:
    type: string
    enum:
      - "active-low"
      - "active-high"
      - "force-present"
    description: |
      SIM card detection configuration applied during modem initialization.
      If not specified, the modem SIM detection configuration is left unchanged.
      - active-low: SIM presence detected from the SIMIN pin, SIM present when low.
      - active-high: SIM presence detected from the SIMIN pin, SIM present when high.
      - force-present: SIMIN pin ignored, SIM always considered present.
